name: Commit Lint
on:
  pull_request:
  push:
    branches:
      - 'main'
jobs:
  code-checks:
    if: github.actor != 'dependabot[bot]'
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate Commit Message
        if: github.ref != 'refs/heads/main'
        uses: wagoid/commitlint-github-action@v6
